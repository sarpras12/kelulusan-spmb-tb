<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Dashboard - SPMB SMP Taruna Bakti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --tb-navy:   #033769;
      --tb-navy-dk:#02284D;
      --tb-blue:   #4298D3;
      --tb-blue-dk:#3480B8;
      --tb-orange: #FCB42A;
      --tb-orange-dk:#D69924;
      --tb-white:  #FFFFFF;
    }
    body {
      background: radial-gradient(ellipse at 50% 55%, #3D82BE 0%, #1B4E82 25%, #0A2E52 50%, #050B14 80%, #020408 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 6px solid var(--tb-navy); }
    .card h3 { color: var(--tb-navy); }
    .text-primary { color: var(--tb-navy) !important; }
    .form-control:focus { border-color: var(--tb-blue); box-shadow: 0 0 0 0.25rem rgba(66,152,211,0.25); }
    .btn-dark { background-color: var(--tb-navy); border-color: var(--tb-navy); }
    .btn-dark:hover, .btn-dark:focus, .btn-dark:active {
      background-color: var(--tb-navy-dk) !important; border-color: var(--tb-navy-dk) !important;
    }
    .btn-success { background-color: var(--tb-orange); border-color: var(--tb-orange); color: var(--tb-navy); font-weight: 600; }
    .btn-success:hover, .btn-success:focus, .btn-success:active {
      background-color: var(--tb-orange-dk) !important; border-color: var(--tb-orange-dk) !important; color: var(--tb-navy) !important;
    }
    .bg-light { background-color: #E9F3FB !important; }
  </style>
</head>
<body class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card p-4 bg-white">
          <h3 class="text-center mb-1">Panel Admin SPMB</h3>
          <p class="text-center text-muted mb-4">SMP Taruna Bakti</p>

          <!-- LOGIN -->
          <div id="login-box">
            <div class="mb-3">
              <label class="form-label">Password Admin</label>
              <input type="password" id="adminPassword" class="form-control" placeholder="Masukkan password...">
            </div>
            <button onclick="loginAdmin()" class="btn btn-dark w-100" id="btnLogin">Masuk Panel</button>
            <div id="login-status" class="mt-2 text-danger text-center small"></div>
          </div>

          <!-- PANEL ADMIN -->
          <div id="admin-panel" style="display: none;">

            <div class="mb-4 p-3 border rounded bg-light">
              <h5 class="mb-3 text-primary">Pengaturan Pengumuman</h5>
              <div class="mb-3">
                <label class="form-label small">Target Tanggal & Jam Countdown (Format: Bulan Hari, Tahun Jam:Menit:Detik)</label>
                <input type="text" id="targetDateInput" class="form-control form-control-sm" placeholder="Contoh: Jun 10, 2026 10:00:00">
              </div>
              <div class="mb-3">
                <label class="form-label small">Pesan Informasi / Pengumuman (Tampil di halaman siswa)</label>
                <textarea id="infoTextInput" class="form-control form-control-sm" rows="3" placeholder="Tulis pengumuman di sini..."></textarea>
              </div>
              <button onclick="simpanPengaturan()" class="btn btn-success btn-sm w-100" id="btnSimpan">Simpan Pengaturan</button>
              <div id="settings-status" class="mt-2 small text-center"></div>
            </div>

            <div class="mb-3 p-3 border rounded bg-light">
              <h5 class="mb-3 text-primary">Upload Data Kelulusan (.xlsx / .csv)</h5>
              <div class="mb-2">
                <input type="file" id="excelFile" class="form-control form-control-sm" accept=".xlsx, .xls, .csv">
              </div>
              <button onclick="uploadExcel()" class="btn btn-dark btn-sm w-100" id="btnUpload">Upload & Aktifkan Data</button>
              <div id="upload-status" class="mt-2 small text-center"></div>
            </div>

            <div class="text-center mt-3">
              <a href="index.html" target="_blank" class="text-decoration-none small">Lihat Halaman Utama Siswa ↗</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== GANTI DENGAN URL WEB APP APPS SCRIPT ANDA ======
    var API_URL = "https://script.google.com/macros/s/GANTI_DENGAN_DEPLOYMENT_ID/exec";
    // =======================================================

    var adminPass = ""; // disimpan di memori saja selama halaman terbuka

    function apiPost(payload) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function(r) { return r.json(); });
    }

    function setStatus(el, ok, msg) {
      el.textContent = msg;
      el.className = (el.className.replace(/\btext-(success|danger)\b/g, '').trim()) + (ok ? ' text-success' : ' text-danger');
    }

    function loginAdmin() {
      var pass = document.getElementById("adminPassword").value;
      var statusDiv = document.getElementById("login-status");
      var btn = document.getElementById("btnLogin");

      if (!pass) {
        statusDiv.textContent = "Password tidak boleh kosong!";
        return;
      }

      btn.disabled = true;
      statusDiv.textContent = "Memeriksa...";

      apiPost({ action: 'login', password: pass })
        .then(function(res) {
          btn.disabled = false;
          if (res.success) {
            adminPass = pass;
            document.getElementById("login-box").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            loadPengaturanData();
          } else {
            statusDiv.textContent = res.message || "Login gagal.";
          }
        })
        .catch(function() {
          btn.disabled = false;
          statusDiv.textContent = "Tidak dapat terhubung ke server.";
        });
    }

    // Tekan Enter untuk login
    document.getElementById("adminPassword").addEventListener("keydown", function(e) {
      if (e.key === "Enter") loginAdmin();
    });

    function loadPengaturanData() {
      apiPost({ action: 'getPengaturan', password: adminPass })
        .then(function(data) {
          if (data.success) {
            document.getElementById("targetDateInput").value = data.targetDate;
            document.getElementById("infoTextInput").value = data.infoText;
          }
        });
    }

    function simpanPengaturan() {
      var targetDate = document.getElementById("targetDateInput").value;
      var infoText = document.getElementById("infoTextInput").value;
      var statusDiv = document.getElementById("settings-status");
      var btn = document.getElementById("btnSimpan");

      btn.disabled = true;
      statusDiv.className = "mt-2 small text-center";
      statusDiv.textContent = "Menyimpan...";

      apiPost({ action: 'simpanPengaturan', targetDate: targetDate, infoText: infoText, password: adminPass })
        .then(function(res) {
          btn.disabled = false;
          setStatus(statusDiv, res.success, res.message);
        })
        .catch(function() {
          btn.disabled = false;
          setStatus(statusDiv, false, "Gagal terhubung ke server.");
        });
    }

    function uploadExcel() {
      var fileInput = document.getElementById("excelFile");
      var statusDiv = document.getElementById("upload-status");
      var btn = document.getElementById("btnUpload");

      if (fileInput.files.length === 0) {
        alert("Pilih file Excel terlebih dahulu!");
        return;
      }

      var file = fileInput.files[0];
      var reader = new FileReader();

      btn.disabled = true;
      statusDiv.className = "mt-2 small text-center";
      statusDiv.textContent = "Mengunggah file...";

      reader.onload = function(e) {
        // hasil DataURL: "data:...;base64,XXXX" -> ambil bagian base64
        var base64 = e.target.result.split(',')[1];
        apiPost({
          action: 'upload',
          password: adminPass,
          data: base64,
          mimeType: file.type,
          fileName: file.name
        })
        .then(function(res) {
          btn.disabled = false;
          setStatus(statusDiv, res.success, res.message);
        })
        .catch(function() {
          btn.disabled = false;
          setStatus(statusDiv, false, "Gagal terhubung ke server.");
        });
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
